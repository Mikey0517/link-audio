<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="color-scheme" content="dark">
  <title>链接音频库</title>
  <link rel="stylesheet" href="/static/style.css?v=1.2.0">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">♪</div>
      <div>
        <h1>链接音频库</h1>
        <p>支持抖音，更多平台可通过 provider 扩展</p>
      </div>
    </div>
    <span class="self-use-badge">个人自用</span>
  </header>

  <main class="app-main">
    <div class="workspace">
      <aside class="workspace-left" aria-label="提取音频">
        <section id="extractCard" class="card extract-card" aria-labelledby="extractTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">提取新音频</p>
              <h2 id="extractTitle">粘贴分享文案</h2>
            </div>
            <span class="keyboard-hint">图文 / 视频</span>
          </div>

          <label class="sr-only" for="shareText">分享文案或链接</label>
          <textarea
            id="shareText"
            class="share-input"
            rows="4"
            maxlength="8000"
            autocomplete="off"
            spellcheck="false"
            placeholder="例如：8.25 复制打开抖音，看看【xxx的作品】…… https://v.douyin.com/xxxxxx/ ……"></textarea>

          <div class="extract-actions">
            <button id="extractBtn" class="primary-btn" type="button">
              <span class="btn-spinner" aria-hidden="true"></span>
              <span class="btn-label">提取音频</span>
            </button>
            <p class="hint">支持抖音图文 / 视频，保存后可直接播放。</p>
          </div>

          <div
            id="extractProgress"
            class="extract-progress"
            role="progressbar"
            aria-label="提取进度"
            aria-valuetext="正在提取音频"
            aria-busy="true"
            hidden>
            <div class="progress-top">
              <span id="progressLabel">正在提取音频…</span>
              <span id="progressElapsed" class="progress-elapsed">0s</span>
            </div>
            <div class="progress-track"><span class="progress-fill"></span></div>
          </div>

          <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
        </section>
      </aside>

      <section class="workspace-right" aria-label="播放器与音频列表">
        <section id="playerCard" class="card player-card is-empty" aria-labelledby="nowPlayingTitle">
          <div class="player-hero">
            <div class="cover-art" aria-hidden="true">
              <span class="cover-note">♪</span>
              <span class="cover-bars"><i></i><i></i><i></i><i></i></span>
            </div>
            <div class="player-detail">
              <div class="player-kicker">
                <p class="eyebrow">当前播放</p>
                <span id="sourceBadge" class="source-badge">本地音频</span>
              </div>
              <h2 id="nowPlayingTitle" class="now-playing-title">选择一首音频</h2>
              <p id="nowPlayingMeta" class="now-playing-meta">播放列表中的音频会显示在这里</p>

              <div class="player-actions">
                <button id="playToggle" class="play-toggle" type="button" aria-label="播放">
                  <span id="playIcon" class="play-icon" aria-hidden="true">▶</span>
                </button>
                <button id="nextBtn" class="next-btn" type="button" aria-label="播放下一首" title="下一首">
                  <span aria-hidden="true">⏭</span>
                </button>
                <label class="auto-next">
                  <input id="autoNext" type="checkbox" checked>
                  <span class="switch" aria-hidden="true"></span>
                  <span>播完自动下一首</span>
                </label>
              </div>
            </div>
          </div>

          <audio id="audio" controls preload="metadata" playsinline>
            你的浏览器不支持 HTML5 音频播放。
          </audio>
        </section>

        <section class="card library-card" aria-labelledby="libraryTitle">
          <div class="library-head">
            <div>
              <p class="eyebrow">播放列表</p>
              <h2 id="libraryTitle">音频库 <span id="audioCount" class="count-pill">0</span></h2>
            </div>
            <div class="library-actions">
              <button id="playAllBtn" class="play-all-btn" type="button">
                <span aria-hidden="true">▶</span> 播放全部
              </button>
              <button id="refreshBtn" class="ghost-btn" type="button">
                <span aria-hidden="true">↻</span> 刷新
              </button>
            </div>
          </div>

          <div id="loadingList" class="list-loading" hidden>
            <span class="btn-spinner" aria-hidden="true"></span> 正在读取音频列表…
          </div>

          <ul id="audioList" class="audio-list" aria-label="音频列表"></ul>

          <div id="emptyState" class="empty-state" hidden>
            <div class="empty-icon" aria-hidden="true">♫</div>
            <h3>还没有音频</h3>
            <p>在左侧粘贴分享文案，点击“提取音频”开始。</p>
          </div>
        </section>
      </section>
    </div>
  </main>

  <footer class="app-footer">
    <span>仅供个人学习与自用 · 音频保存在本机服务器</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="confirmModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" hidden>
    <div class="modal-card">
      <p class="eyebrow">删除音频</p>
      <h2 id="confirmTitle">确定删除？</h2>
      <p id="confirmText" class="modal-text"></p>
      <div class="modal-actions">
        <button id="cancelDelete" class="ghost-btn large" type="button">取消</button>
        <button id="confirmDelete" class="danger-btn large" type="button">删除</button>
      </div>
    </div>
  </div>

  <template id="audioItemTemplate">
    <li class="audio-item">
      <button class="item-main" type="button">
        <span class="item-play" aria-hidden="true">▶</span>
        <span class="item-copy">
          <span class="item-title"></span>
          <span class="item-meta">
            <span class="item-platform"></span>
            <span class="dot" aria-hidden="true">·</span>
            <span class="item-author"></span>
            <span class="dot" aria-hidden="true">·</span>
            <span class="item-date"></span>
            <span class="dot" aria-hidden="true">·</span>
            <span class="item-duration"></span>
          </span>
        </span>
        <span class="equalizer" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <button class="delete-btn" type="button">删除</button>
    </li>
  </template>

  <script src="/static/app.js?v=1.2.0" defer></script>
</body>
</html>
