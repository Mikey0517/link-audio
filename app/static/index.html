<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="color-scheme" content="dark">
  <title>解析音频 · 链接音频库</title>
  <link rel="stylesheet" href="/static/style.css?v=1.3.0">
</head>
<body class="page-extract">
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="app-header">
    <a class="brand brand-link" href="/">
      <div class="brand-mark" aria-hidden="true">♪</div>
      <div>
        <h1>链接音频库</h1>
        <p>支持抖音，更多平台可通过 provider 扩展</p>
      </div>
    </a>
    <div class="header-tools">
      <nav class="app-nav" aria-label="主导航">
        <a href="/" class="is-active" aria-current="page">解析</a>
        <a href="/library">音乐库</a>
      </nav>
      <span class="self-use-badge">个人自用</span>
    </div>
  </header>

  <main class="app-main parse-page">
    <section class="parse-intro" aria-labelledby="parseTitle">
      <p class="eyebrow">解析</p>
      <h2 id="parseTitle">把分享链接<br><span>变成可播放的音频</span></h2>
      <p class="parse-lede">粘贴抖音分享文案，提取后自动保存到音乐库。</p>
      <div class="parse-badges" aria-label="支持能力">
        <span>图文原声</span>
        <span>视频抽轨</span>
        <span>本地保存</span>
      </div>
    </section>

    <section id="extractCard" class="card extract-card extract-hero" aria-labelledby="extractTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">提取新音频</p>
          <h2 id="extractTitle">粘贴分享文案</h2>
        </div>
        <span class="keyboard-hint">图文 / 视频</span>
      </div>

      <label class="sr-only" for="shareText">分享文案或链接</label>
      <textarea
        id="shareText"
        class="share-input"
        rows="5"
        maxlength="8000"
        autocomplete="off"
        spellcheck="false"
        placeholder="例如：8.25 复制打开抖音，看看【xxx的作品】…… https://v.douyin.com/xxxxxx/ ……"></textarea>

      <div class="extract-actions">
        <button id="extractBtn" class="primary-btn" type="button">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="btn-label">提取音频</span>
        </button>
        <p class="hint">支持抖音图文 / 视频，保存后可直接播放。</p>
      </div>

      <div
        id="extractProgress"
        class="extract-progress"
        role="progressbar"
        aria-label="提取进度"
        aria-valuetext="正在提取音频"
        aria-busy="true"
        hidden>
        <div class="progress-top">
          <span id="progressLabel">正在提取音频…</span>
          <span id="progressElapsed" class="progress-elapsed">0s</span>
        </div>
        <div class="progress-track"><span class="progress-fill"></span></div>
      </div>

      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

      <div id="successActions" class="success-actions" role="status" aria-live="polite" hidden>
        <div class="success-copy">
          <strong>已保存到音乐库</strong>
          <span>可以去播放，或继续粘贴下一条。</span>
        </div>
        <a class="primary-btn success-btn" href="/library">去音乐库播放</a>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <span>仅供个人学习与自用 · 音频保存在本机服务器</span>
  </footer>

  <script src="/static/common.js?v=1.3.0" defer></script>
  <script src="/static/extract.js?v=1.3.0" defer></script>
</body>
</html>
