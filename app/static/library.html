<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="color-scheme" content="dark">
  <title>音乐库 · 链接音频库</title>
  <link rel="stylesheet" href="/static/style.css?v=1.4.0">
</head>
<body class="page-library">
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="app-header">
    <a class="brand brand-link" href="/">
      <div class="brand-mark" aria-hidden="true">♪</div>
      <div>
        <h1>链接音频库</h1>
      </div>
    </a>
    <div class="header-tools">
      <nav class="app-nav" aria-label="主导航">
        <a href="/">解析</a>
        <a href="/library" class="is-active" aria-current="page">音乐库</a>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <div class="workspace music-workspace">
      <aside class="workspace-left" aria-label="播放器">
        <section id="playerCard" class="card player-card is-empty" aria-labelledby="nowPlayingTitle">
          <div class="player-hero">
            <div class="cover-art" aria-hidden="true">
              <span class="cover-note">♪</span>
              <span class="cover-bars"><i></i><i></i><i></i><i></i></span>
            </div>
            <div class="player-detail">
              <div class="player-kicker">
                <p class="eyebrow">当前播放</p>
                <span id="sourceBadge" class="source-badge">本地音频</span>
              </div>
              <h2 id="nowPlayingTitle" class="now-playing-title">选择一首音频</h2>
              <p id="nowPlayingMeta" class="now-playing-meta">播放列表中的音频会显示在这里</p>

              <div class="player-actions">
                <button id="playToggle" class="play-toggle" type="button" aria-label="播放">
                  <span id="playIcon" class="play-icon" aria-hidden="true">▶</span>
                </button>
                <button id="nextBtn" class="next-btn" type="button" aria-label="播放下一首" title="下一首">
                  <span aria-hidden="true">⏭</span>
                </button>
                <label class="auto-next">
                  <input id="autoNext" type="checkbox" checked>
                  <span class="switch" aria-hidden="true"></span>
                  <span>播完自动下一首</span>
                </label>
              </div>
            </div>
          </div>

          <audio id="audio" controls preload="metadata" playsinline>
            你的浏览器不支持 HTML5 音频播放。
          </audio>
        </section>
      </aside>

      <section class="workspace-right" aria-label="播放列表">
        <section class="card library-card" aria-labelledby="libraryTitle">
          <div class="library-head">
            <div>
              <p class="eyebrow">播放列表</p>
              <h2 id="libraryTitle">音频库 <span id="audioCount" class="count-pill">0</span></h2>
            </div>
            <div class="library-actions">
              <button id="playAllBtn" class="play-all-btn" type="button">
                <span aria-hidden="true">▶</span> 播放全部
              </button>
              <button id="refreshBtn" class="ghost-btn" type="button">
                <span aria-hidden="true">↻</span> 刷新
              </button>
            </div>
          </div>

          <div id="loadingList" class="list-loading" hidden>
            <span class="btn-spinner" aria-hidden="true"></span> 正在读取音频列表…
          </div>

          <ul id="audioList" class="audio-list" aria-label="音频列表"></ul>

          <div id="emptyState" class="empty-state" hidden>
            <div class="empty-icon" aria-hidden="true">♫</div>
            <h3>音乐库还是空的</h3>
            <p>去 <a href="/">解析页</a> 粘贴一条分享文案吧。</p>
          </div>
        </section>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="confirmModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" hidden>
    <div class="modal-card">
      <p class="eyebrow">删除音频</p>
      <h2 id="confirmTitle">确定删除？</h2>
      <p id="confirmText" class="modal-text"></p>
      <div class="modal-actions">
        <button id="cancelDelete" class="ghost-btn large" type="button">取消</button>
        <button id="confirmDelete" class="danger-btn large" type="button">删除</button>
      </div>
    </div>
  </div>

  <template id="audioItemTemplate">
    <li class="audio-item">
      <button class="item-main" type="button">
        <span class="item-play" aria-hidden="true">▶</span>
        <span class="item-copy">
          <span class="item-title"></span>
          <span class="item-meta">
            <span class="item-platform"></span>
            <span class="dot" aria-hidden="true">·</span>
            <span class="item-author"></span>
            <span class="dot" aria-hidden="true">·</span>
            <span class="item-date"></span>
            <span class="dot" aria-hidden="true">·</span>
            <span class="item-duration"></span>
          </span>
        </span>
        <span class="equalizer" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <button class="delete-btn" type="button">删除</button>
    </li>
  </template>

  <script src="/static/common.js?v=1.4.0" defer></script>
  <script src="/static/library.js?v=1.4.0" defer></script>
</body>
</html>
